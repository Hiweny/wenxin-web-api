name: ui-shot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/res/**'
      - 'app/src/main/java/**'
      - '.github/workflows/ui-shot.yml'

jobs:
  e2e-apk:
    name: 真机(模拟器)E2E + UI 截图
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: 构建 debug APK
        run: gradle assembleDebug --no-daemon
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 模拟器内跑通 APK API
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.hiweny.wenxinapi/.MainActivity
            sleep 6
            adb exec-out screencap -p > shot_idle.png
            adb shell am force-stop com.hiweny.wenxinapi
            sleep 1
            adb shell appops set com.hiweny.wenxinapi SYSTEM_ALERT_WINDOW allow || true
            adb shell am start -n com.hiweny.wenxinapi/.MainActivity --ez auto_start true --ez bubble true
            sleep 18
            adb exec-out screencap -p > shot_running.png
            adb shell dumpsys activity services com.hiweny.wenxinapi > services.txt || true
            adb logcat -d -s WenxinApi:* AndroidRuntime:E ActivityManager:E > logcat.txt || true
            adb forward tcp:18888 tcp:8787
            echo "=== debug probe ==="
            curl -s --max-time 120 "http://127.0.0.1:18888/debug/probe" > probe.json || true
            cat probe.json
            echo
            adb logcat -d | tail -2500 > full_logcat.txt || true
            echo "=== e2e (对话/多轮/思考/识图/工具/存档) ==="
            python3 tools/e2e_api.py http://127.0.0.1:18888 sk-wenxin
            adb exec-out screencap -p > shot_after_chat.png
            adb logcat -d | tail -3000 > full_logcat2.txt || true
            if grep -q "FATAL EXCEPTION" full_logcat2.txt; then echo "APP CRASHED"; grep -A20 "FATAL EXCEPTION" full_logcat2.txt; exit 1; fi
            echo "no crash detected"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: |
            shot_*.png
            services.txt
            logcat.txt
            full_logcat.txt
            full_logcat2.txt
            probe.json
